name: Build Windows package
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
      - docs/RELEASE.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm toolchain
        run: npm install --global npm@10.9.2
      - name: Install pinned Electron runtime
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run check
      - run: npm test
      - name: Package public Windows application
        run: node scripts/package-desktop.mjs --out ../Resonance-Windows
      - name: Package source
        run: node scripts/package-source.mjs --out ../Resonance-Source
      - name: Archive Windows package and calculate checksum
        shell: pwsh
        run: |
          $packageDirectory = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../Resonance-Windows'))
          $zipPath = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../Resonance-Windows.zip'))
          Compress-Archive -LiteralPath $packageDirectory -DestinationPath $zipPath -CompressionLevel Optimal
          $digest = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($zipPath + '.sha256') -Value ($digest + '  Resonance-Windows.zip') -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-Windows
          path: |
            ../Resonance-Windows.zip
            ../Resonance-Windows.zip.sha256
            ../Resonance-Source.zip
          if-no-files-found: error
      - name: Publish preview release after all checks and packaging succeed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag = 'v' + $version
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'resonance-release'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $windowsName = 'Resonance-' + $tag + '-Windows-x64.zip'
          $sourceName = 'Resonance-' + $tag + '-source.zip'
          $windowsAsset = Join-Path $releaseDirectory $windowsName
          $sourceAsset = Join-Path $releaseDirectory $sourceName
          Copy-Item -LiteralPath '../Resonance-Windows.zip' -Destination $windowsAsset
          Copy-Item -LiteralPath '../Resonance-Source.zip' -Destination $sourceAsset
          $checksum = Join-Path $releaseDirectory 'SHA256SUMS.txt'
          $lines = @(
            (Get-FileHash -LiteralPath $windowsAsset -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $windowsName
            (Get-FileHash -LiteralPath $sourceAsset -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $sourceName
          )
          Set-Content -LiteralPath $checksum -Value $lines -Encoding ascii
          gh release create $tag --target $env:GITHUB_SHA --title ('Resonance ' + $tag) --notes-file docs/RELEASE.md --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten' }
          gh release upload $tag $windowsAsset $sourceAsset $checksum
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
